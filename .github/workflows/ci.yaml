name: CI

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - run: echo "::remove-matcher owner=tsc::"
      - run: echo "::remove-matcher owner=eslint-compact::"
      - run: echo "::remove-matcher owner=eslint-stylish::"
      - run: node --version
      - run: npm --version
      - run: yarn --version
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - if: startsWith(github.ref, 'refs/tags/')
        name: set package.json version by tag
        run: npm version --allow-same-version --no-commit-hooks --no-git-tag-version from-git
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
